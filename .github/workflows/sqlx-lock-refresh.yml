name: Temporary SQLx Lock Refresh

on:
  push:
    branches:
      - agent/modernize-2026
    paths:
      - Cargo.toml
      - .github/workflows/sqlx-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: sqlx-lock-refresh-agent-modernize-2026
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/modernize-2026
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Re-resolve the locked dependency graph
        run: |
          cargo update -p sqlx --precise 0.9.0
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          git diff --check

      - name: Verify SQLx database backends are minimized
        run: |
          ! cargo tree --locked -i sqlx-mysql >/dev/null 2>&1
          ! cargo tree --locked -i sqlx-sqlite >/dev/null 2>&1

      - name: Commit refreshed lockfile only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "Cargo.lock did not require changes."
            exit 0
          fi
          if printf '%s\n' "${changed[@]}" | grep -Ev '^Cargo\.lock$'; then
            echo "Unexpected file changed while refreshing the lockfile." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh lockfile for PostgreSQL-only SQLx"
          gh auth setup-git
          git push origin HEAD:agent/modernize-2026
