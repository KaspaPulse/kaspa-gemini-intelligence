name: Temporary Modernization Gate

on:
  push:
    branches:
      - agent/modernize-2026
    paths:
      - Cargo.toml
      - rust-toolchain.toml
      - Dockerfile
      - src/**
      - tests/**
      - scripts/update-rusty-kaspa-latest.ps1
      - .github/workflows/modernization-gate.yml

permissions:
  contents: write

concurrency:
  group: temporary-modernization-gate
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  CARGO_INCREMENTAL: "0"
  APP_ENV: "ci"
  RUST_LOG: "info"
  ENABLE_VERBOSE_LOGS: "false"
  BOT_TOKEN: "1234567890:TEST_PLACEHOLDER_TOKEN_NOT_REAL"
  ADMIN_ID: "484901117"
  NODE_URL_01: "wss://example.invalid/json"
  DATABASE_URL: "postgres://kaspa_pulse_app:TEST_PASSWORD@127.0.0.1:5432/kaspa_dev?sslmode=disable"
  DATABASE_ADMIN_URL: "postgres://postgres:POSTGRES_TEST_PASSWORD@127.0.0.1:5432/kaspa_dev?sslmode=disable"
  WEBHOOK_SECRET_TOKEN: "TEST_WEBHOOK_SECRET_TOKEN_PLACEHOLDER_32_CHARS"
  USE_WEBHOOK: "false"
  WEBHOOK_DOMAIN: "example.invalid"
  WEBHOOK_PORT: "8443"
  WEBHOOK_BIND: "127.0.0.1"
  WEBHOOK_MAX_CONNECTIONS: "20"
  WEBHOOK_ALLOW_PUBLIC_BIND: "false"
  HEALTH_ENDPOINT_ENABLED: "true"
  HEALTH_BIND: "127.0.0.1"
  HEALTH_PORT: "18080"
  HEALTH_ALLOW_PUBLIC_BIND: "false"
  ENABLE_TELEGRAM_DELIVERY_QUEUE: "true"
  ENABLE_ALERT_DELIVERY: "true"
  MIN_REWARD_CONFIRMATIONS: "10"
  MAX_WALLETS_PER_USER: "10"
  RATE_LIMIT_COMMANDS_PER_SECOND: "1"
  RATE_LIMIT_CALLBACKS_PER_SECOND: "3"
  RATE_LIMIT_ADD_WALLET_PER_MINUTE: "5"
  MAX_RAW_MESSAGE_CHARS: "512"
  MAX_WALLET_ADDRESS_CHARS: "120"
  LOG_MAX_CHARS: "3000"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kaspa_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: POSTGRES_TEST_PASSWORD
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaspa_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/modernize-2026
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Refresh compatible dependency graph
        run: cargo update

      - name: Format Rust 2024 sources
        run: cargo fmt --all

      - name: Validate updater PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/update-rusty-kaspa-latest.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Prepare PostgreSQL test schema
        run: bash scripts/ci-prepare-postgres.sh

      - name: Install security tools
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-audit,cargo-deny

      - name: Cargo check
        run: cargo check --all-targets --all-features

      - name: Clippy strict
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets --all-features

      - name: Release build
        run: cargo build --release --all-features

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny
        run: cargo deny check

      - name: Docker build
        run: docker build --pull --tag kaspa-pulse:modernization-test .

      - name: Verify generated diff
        run: git diff --check

      - name: Commit generated lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh generated dependency state"
          git push origin HEAD:agent/modernize-2026
