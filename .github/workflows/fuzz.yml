name: Rust Fuzzing

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "fuzz/**"
      - "src/utils.rs"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main, dev]
    paths:
      - "fuzz/**"
      - "src/utils.rs"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "47 3 * * 6"
  workflow_dispatch:

concurrency:
  group: rust-fuzz-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  text-safety:
    name: text and wallet input fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-08-01
          components: rustfmt

      - name: Install verified cargo-fuzz 0.13.2 binary
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/cargo-fuzz-0.13.2.tar.gz"
          extract_dir="/tmp/cargo-fuzz-0.13.2"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.13.2/cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz"
          echo "b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c  $archive" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          binary="$(find "$extract_dir" -maxdepth 2 -type f -name cargo-fuzz -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cargo-fuzz
          cargo-fuzz --version

      - name: Check fuzz target formatting
        run: cargo +nightly-2026-08-01 fmt --manifest-path fuzz/Cargo.toml -- --check

      - name: Fuzz untrusted text and wallet inputs
        run: cargo +nightly-2026-08-01 fuzz run text_safety -- -max_total_time=45 -timeout=5 -max_len=2048 -rss_limit_mb=4096
