name: One-shot Cargo Maintenance Refresh

on:
  push:
    branches:
      - agent/modernize-2026
    paths:
      - Cargo.toml
      - rust-toolchain.toml
      - .github/workflows/maintenance-refresh.yml

permissions:
  contents: write

concurrency:
  group: maintenance-refresh-agent-modernize-2026
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/modernize-2026
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Format and refresh all compatible Cargo dependencies
        run: |
          cargo fmt --all
          cargo update
          git diff --check

      - name: Install cargo-audit
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-audit

      - name: Audit refreshed lockfile
        id: audit
        continue-on-error: true
        run: cargo audit

      - name: Commit generated maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: format Rust 2024 and refresh Cargo lockfile"
          git push origin HEAD:agent/modernize-2026

      - name: Require clean security audit
        if: always()
        run: |
          if [ "${{ steps.audit.outcome }}" != "success" ]; then
            echo "cargo audit still reports actionable advisories after lockfile refresh"
            exit 1
          fi
