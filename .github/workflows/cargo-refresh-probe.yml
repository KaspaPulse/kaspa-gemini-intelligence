name: Cargo Refresh Probe

on:
  push:
    branches:
      - chore/modernize-github-free-2026-08-08

permissions:
  contents: write

concurrency:
  group: cargo-refresh-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SQLX_OFFLINE: true

jobs:
  refresh:
    name: refresh latest compatible Cargo.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout probe branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/modernize-github-free-2026-08-08
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Refresh compatible dependencies
        run: cargo update

      - name: Verify refreshed dependency graph compiles
        run: cargo check --locked --all-targets --all-features

      - name: Commit refreshed lockfile when needed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already fully current within declared SemVer ranges."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): refresh Cargo.lock"
          gh auth setup-git
          git push origin HEAD:chore/modernize-github-free-2026-08-08
