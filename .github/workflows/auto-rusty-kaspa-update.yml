name: Auto Update rusty-kaspa

on:
  workflow_dispatch:
    inputs:
      allow_prerelease:
        description: "Allow rusty-kaspa pre-release tags"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-rusty-kaspa-update
  cancel-in-progress: false

jobs:
  update-rusty-kaspa:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout dev
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "kaspa-pulse-auto-updater"
          git config user.email "actions@github.com"

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Install audit tools
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-audit,cargo-deny

      - name: Auto update rusty-kaspa to latest release
        id: update
        shell: pwsh
        run: |
          $allow = "${{ inputs.allow_prerelease }}"
          if ([string]::IsNullOrWhiteSpace($allow)) {
            $allow = "false"
          }

          $args = @(
            "-BaseBranch", "dev",
            "-Push"
          )

          if ($allow -eq "true") {
            $args += "-AllowPrerelease"
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\update-rusty-kaspa-latest.ps1" @args

      - name: Create pull request if needed
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $branch = (git branch --show-current).Trim()

          if ($branch -eq "dev") {
            Write-Host "No update branch was created. Already up to date."
            exit 0
          }

          $existing = gh pr list --head $branch --base dev --json number --jq ".[0].number"

          if ($existing) {
            Write-Host "PR already exists: $existing"
            exit 0
          }

          gh pr create `
            --base dev `
            --head $branch `
            --title "Auto update rusty-kaspa dependencies" `
            --body "Automated update to the latest rusty-kaspa release tag. Validation passed: fmt, check, clippy, test, audit/deny/security pipeline."
