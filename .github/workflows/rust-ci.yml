name: Rust CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  CARGO_INCREMENTAL: "0"
  APP_ENV: "ci"
  RUST_LOG: "info"
  ENABLE_VERBOSE_LOGS: "false"
  BOT_TOKEN: "1234567890:TEST_PLACEHOLDER_TOKEN_NOT_REAL"
  ADMIN_ID: "484901117"
  NODE_URL_01: "wss://example.invalid/json"
  DATABASE_URL: "postgres://kaspa_pulse_app:TEST_PASSWORD@127.0.0.1:5432/kaspa_dev?sslmode=disable"
  DATABASE_ADMIN_URL: "postgres://postgres:POSTGRES_TEST_PASSWORD@127.0.0.1:5432/kaspa_dev?sslmode=disable"
  WEBHOOK_SECRET_TOKEN: "TEST_WEBHOOK_SECRET_TOKEN_PLACEHOLDER_32_CHARS"
  USE_WEBHOOK: "false"
  WEBHOOK_DOMAIN: "example.invalid"
  WEBHOOK_PORT: "8443"
  WEBHOOK_BIND: "127.0.0.1"
  WEBHOOK_MAX_CONNECTIONS: "20"
  WEBHOOK_ALLOW_PUBLIC_BIND: "false"
  HEALTH_ENDPOINT_ENABLED: "true"
  HEALTH_BIND: "127.0.0.1"
  HEALTH_PORT: "18080"
  HEALTH_ALLOW_PUBLIC_BIND: "false"
  ENABLE_TELEGRAM_DELIVERY_QUEUE: "true"
  ENABLE_ALERT_DELIVERY: "true"
  MIN_REWARD_CONFIRMATIONS: "10"
  MAX_WALLETS_PER_USER: "10"
  RATE_LIMIT_COMMANDS_PER_SECOND: "1"
  RATE_LIMIT_CALLBACKS_PER_SECOND: "3"
  RATE_LIMIT_ADD_WALLET_PER_MINUTE: "5"
  MAX_RAW_MESSAGE_CHARS: "512"
  MAX_WALLET_ADDRESS_CHARS: "120"
  LOG_MAX_CHARS: "3000"

jobs:
  check:
    name: fmt + check + clippy + test + release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kaspa_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: POSTGRES_TEST_PASSWORD
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaspa_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Show versions
        run: |
          rustc --version
          cargo --version

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Prepare PostgreSQL test schema
        run: bash scripts/ci-prepare-postgres.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --locked --all-targets --all-features

      - name: Clippy strict
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Build production release
        run: cargo build --locked --release --all-features
