name: Container Refresh Probe

on:
  push:
    branches:
      - chore/modernize-github-free-2026-08-08

permissions:
  contents: read

concurrency:
  group: container-refresh-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: resolve and validate official image digests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout probe branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve current official image digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          resolve_digest() {
            local image="$1"
            local tag="$2"
            curl --fail --silent --show-error --retry 5 \
              "https://hub.docker.com/v2/repositories/library/${image}/tags/${tag}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])'
          }

          rust_digest="$(resolve_digest rust 1.97.1-slim-trixie)"
          debian_digest="$(resolve_digest debian trixie-slim)"
          postgres_digest="$(resolve_digest postgres 18)"

          for digest in "$rust_digest" "$debian_digest" "$postgres_digest"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done

          echo "RUST_DIGEST=$rust_digest"
          echo "DEBIAN_DIGEST=$debian_digest"
          echo "POSTGRES_DIGEST=$postgres_digest"
          echo "rust_digest=$rust_digest" >> "$GITHUB_OUTPUT"
          echo "debian_digest=$debian_digest" >> "$GITHUB_OUTPUT"
          echo "postgres_digest=$postgres_digest" >> "$GITHUB_OUTPUT"

      - name: Validate refreshed production Dockerfile
        shell: bash
        env:
          RUST_DIGEST: ${{ steps.digests.outputs.rust_digest }}
          DEBIAN_DIGEST: ${{ steps.digests.outputs.debian_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("Dockerfile")
          text = path.read_text()
          text = re.sub(r"^# syntax=docker/dockerfile:[^\n]+", "# syntax=docker/dockerfile:1", text, count=1, flags=re.M)
          text = re.sub(r"rust:1\.97\.1-slim-trixie@sha256:[0-9a-f]{64}", f"rust:1.97.1-slim-trixie@{os.environ['RUST_DIGEST']}", text)
          text = re.sub(r"debian:trixie-slim@sha256:[0-9a-f]{64}", f"debian:trixie-slim@{os.environ['DEBIAN_DIGEST']}", text)
          path.write_text(text)
          PY
          docker build --pull -t kaspa-pulse:container-refresh-probe .
